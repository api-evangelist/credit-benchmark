aid: credit-benchmark
name: Credit Benchmark
description: >-
  Credit Benchmark is a financial data company that aggregates confidential credit-risk
  estimates from over 40 leading global financial institutions into anonymized consensus
  Credit Consensus Ratings (CCRs) and analytics covering 120,000+ public and private
  entities, most of which are unrated by traditional agencies. Risk professionals across
  banking, insurance, and asset management use the data for customer onboarding and credit
  decisioning, portfolio monitoring, model calibration, market valuation, and regulatory
  and third-party risk validation. Delivery channels include a REST API (gateway.creditbenchmark.com),
  a web application, an Excel Add-In, SFTP/secure file transfer, and data marketplaces
  (Snowflake, Databricks, AWS Data Exchange). The Consensus Data API exposes JWT-authenticated
  entity resolution, raw data extraction, computed analytics (trends, breakdowns, rating
  changes, distributions), and metadata discovery. Backed by Index Ventures.
